[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "migraguard"
version = "0.1.0"
description = "Static analysis tool for SQL migration files — flags risky schema operations before they merge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlglot>=23.0",
    "click>=8.1",
    "rich>=13.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
]

[project.scripts]
migraguard = "migraguard.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["migraguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
